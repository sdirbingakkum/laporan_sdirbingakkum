name: Deploy UI Preview

on:
  push:
    branches:
      - ui/mobile-first-analytics
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages-ui-preview
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.3'
  PREVIEW_PATH: '/laporan_sdirbingakkum/preview/ui-mobile-first-analytics/'

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    environment:
      name: github-pages-preview
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
          path: main-src

      - name: Checkout preview branch
        uses: actions/checkout@v6
        with:
          ref: ui/mobile-first-analytics
          path: preview-src

      - name: Set up Flutter and Dart
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
          pub-cache: true

      - name: Verify Flutter and Dart CLI
        run: |
          flutter --version
          dart --version

      - name: Validate Supabase publishable key
        env:
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ -z "$SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "::error::Missing GitHub Actions secret SUPABASE_PUBLISHABLE_KEY"
            exit 1
          fi

      - name: Build main site
        working-directory: main-src
        env:
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          flutter create . --platforms=web
          flutter pub get
          cat > /tmp/main-supabase-defines.json <<EOF
          {
            "SUPABASE_URL": "https://ybepaqmrrgsaeqnqrsrf.supabase.co",
            "SUPABASE_PUBLISHABLE_KEY": "$SUPABASE_PUBLISHABLE_KEY"
          }
          EOF
          flutter build web \
            --release \
            --base-href "/laporan_sdirbingakkum/" \
            --dart-define-from-file=/tmp/main-supabase-defines.json
          rm -f /tmp/main-supabase-defines.json

      - name: Prepare main deep-link entrypoints
        working-directory: main-src
        run: |
          cp build/web/index.html build/web/404.html
          for route in \
            gakkum \
            pelanggaran \
            sim-tni \
            provos \
            laka-lalin \
            tindak-pidana \
            pomdam \
            reports \
            input-laporan \
            data-quality \
            laporan \
            perbandingan
          do
            mkdir -p "build/web/$route"
            cp build/web/index.html "build/web/$route/index.html"
          done

      - name: Build UI preview
        working-directory: preview-src
        env:
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          flutter create . --platforms=web
          flutter pub get
          cat > /tmp/preview-supabase-defines.json <<EOF
          {
            "SUPABASE_URL": "https://ybepaqmrrgsaeqnqrsrf.supabase.co",
            "SUPABASE_PUBLISHABLE_KEY": "$SUPABASE_PUBLISHABLE_KEY"
          }
          EOF
          flutter build web \
            --release \
            --base-href "$PREVIEW_PATH" \
            --dart-define-from-file=/tmp/preview-supabase-defines.json
          rm -f /tmp/preview-supabase-defines.json

      - name: Prepare preview deep-link entrypoints
        working-directory: preview-src
        run: |
          cp build/web/index.html build/web/404.html
          for route in \
            gakkum \
            pelanggaran \
            sim-tni \
            provos \
            laka-lalin \
            tindak-pidana \
            pomdam \
            laporan \
            perbandingan \
            reports \
            input-laporan \
            data-quality
          do
            mkdir -p "build/web/$route"
            cp build/web/index.html "build/web/$route/index.html"
          done

      - name: Assemble Pages artifact
        run: |
          rm -rf build
          mkdir -p build/web/preview/ui-mobile-first-analytics
          cp -a main-src/build/web/. build/web/
          rm -rf build/web/preview/ui-mobile-first-analytics
          cp -a preview-src/build/web/. build/web/preview/ui-mobile-first-analytics/
          printf '{"previewCommit":"%s","mainCommit":"%s"}\n' \
            "${{ github.sha }}" \
            "$(git -C main-src rev-parse HEAD)" > build/web/preview/ui-mobile-first-analytics/deployment.json

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/web

      - name: Deploy preview to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
