name: Flutter

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.3'
          channel: stable

      - name: Create Flutter platform runners
        run: flutter create . --platforms=android,web,windows

      - name: Pub get
        run: flutter pub get

      - name: Format
        run: dart format lib test

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test
