name: Flutter

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: flutter-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.3'
          channel: stable

      - name: Create Flutter platform runners
        run: flutter create . --platforms=android,web,windows

      - name: Remove generated starter test
        run: rm -f test/widget_test.dart

      - name: Pub get
        run: flutter pub get

      - name: Format
        run: dart format lib test

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build Web release
        run: flutter build web --release
