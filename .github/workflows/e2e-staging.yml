name: E2E Staging

on:
  workflow_call:
    secrets:
      E2E_EMAIL:
        required: true
      E2E_PASSWORD:
        required: true
  workflow_dispatch:

permissions:
  contents: read


jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Validate E2E secrets
        env:
          E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
        run: |
          if [ -z "$E2E_EMAIL" ] || [ -z "$E2E_PASSWORD" ]; then
            echo "::error::Missing E2E_EMAIL or E2E_PASSWORD repository secrets"
            exit 1
          fi

      - name: Install E2E dependencies
        run: npm install --no-audit --no-fund

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Wait for deployed commit to become available
        env:
          BASE_URL: https://sdirbingakkum.github.io/laporan_sdirbingakkum/
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          for attempt in $(seq 1 30); do
            status="$(curl -L -s -o /tmp/deployment.json -w '%{http_code}' "$BASE_URL/deployment.json")"
            actual=""
            if [ "$status" = "200" ]; then
              actual="$(jq -r '.commit // empty' /tmp/deployment.json 2>/dev/null || true)"
            fi
            echo "attempt=$attempt http_status=$status deployed_sha=$actual"
            if [ "$status" = "200" ] && [ "$actual" = "$EXPECTED_SHA" ]; then
              exit 0
            fi
            sleep 5
          done
          echo "::error::GitHub Pages did not serve expected commit $EXPECTED_SHA within 150 seconds"
          exit 1
      - name: Run Playwright E2E
        env:
          CI: true
          E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
          PLAYWRIGHT_TEST_BASE_URL: https://sdirbingakkum.github.io/laporan_sdirbingakkum/
          E2E_EXPECTED_SHA: ${{ github.sha }}
        run: npm run e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - name: Upload Playwright test artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: playwright-test-artifacts
          path: test-results/
          retention-days: 14
