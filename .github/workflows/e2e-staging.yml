name: E2E Staging

on:
  deployment_status:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-staging
  cancel-in-progress: true

jobs:
  e2e:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'deployment_status' &&
       github.event.deployment_status.state == 'success' &&
       github.event.deployment_status.environment == 'github-pages')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Validate E2E secrets
        env:
          E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
        run: |
          if [ -z "$E2E_EMAIL" ] || [ -z "$E2E_PASSWORD" ]; then
            echo "::error::Missing E2E_EMAIL or E2E_PASSWORD repository secrets"
            exit 1
          fi

      - name: Install E2E dependencies
        run: npm install --no-audit --no-fund

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Resolve deployed URL
        id: url
        env:
          DEPLOYMENT_URL: ${{ github.event.deployment_status.target_url }}
        run: |
          URL="$DEPLOYMENT_URL"
          if [ -z "$URL" ]; then
            URL="https://sdirbingakkum.github.io/laporan_sdirbingakkum/"
          fi
          echo "base_url=$URL" >> "$GITHUB_OUTPUT"

      - name: Run Playwright E2E
        env:
          CI: true
          E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
          PLAYWRIGHT_TEST_BASE_URL: ${{ steps.url.outputs.base_url }}
        run: npm run e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - name: Upload Playwright test artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: playwright-test-artifacts
          path: test-results/
          retention-days: 14
