name: Deploy Flutter Web

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.3'
          channel: stable

      - name: Create Flutter web runner
        run: flutter create . --platforms=web

      - name: Pub get
        run: flutter pub get

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Validate Supabase publishable key
        env:
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ -z "$SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "::error::Missing GitHub Actions secret SUPABASE_PUBLISHABLE_KEY"
            exit 1
          fi

      - name: Build Flutter web release
        env:
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          cat > /tmp/supabase_defines.json <<EOF
          {
            "SUPABASE_URL": "https://ybepaqmrrgsaeqnqrsrf.supabase.co",
            "SUPABASE_PUBLISHABLE_KEY": "$SUPABASE_PUBLISHABLE_KEY"
          }
          EOF

          flutter build web \
            --release \
            --base-href "/laporan_sdirbingakkum/" \
            --dart-define-from-file=/tmp/supabase_defines.json

          rm -f /tmp/supabase_defines.json

      - name: Write deployment marker
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          printf '{"commit":"%s"}\n' "$COMMIT_SHA" > build/web/deployment.json
          cp build/web/index.html build/web/404.html
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  e2e:
    name: E2E Staging
    needs: deploy
    uses: ./.github/workflows/e2e-staging.yml
    secrets:
      E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
      E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
